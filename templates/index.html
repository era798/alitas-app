<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú de Alitas</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f8;
            color: #333;
            padding: 15px;
        }
        .contenedor-app {
            max-width: 480px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        .header-menu {
            text-align: center;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
            margin-bottom: 15px;
        }
        .header-menu h1 {
            font-size: 1.5rem;
            color: #d32f2f;
            letter-spacing: 1px;
        }
        .producto-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 0;
            border-bottom: 1px solid #eeeeee;
        }
        .producto-card:last-child {
            border-bottom: none;
        }
        .producto-info {
            flex: 1;
            padding-right: 12px;
        }
        .categoria-tag {
            display: inline-block;
            font-size: 0.7rem;
            font-weight: bold;
            background: #ffebee;
            color: #c62828;
            padding: 2px 8px;
            border-radius: 12px;
            margin-bottom: 4px;
            text-transform: uppercase;
        }
        .producto-titulo {
            font-size: 1rem;
            font-weight: 700;
            color: #222;
            margin-bottom: 4px;
            text-transform: uppercase;
        }
        .producto-desc {
            font-size: 0.85rem;
            color: #666;
            line-height: 1.3;
            margin-bottom: 6px;
        }
        .producto-precio {
            font-size: 1.05rem;
            font-weight: bold;
            color: #0083b0;
        }
        .producto-img {
            width: 85px;
            height: 85px;
            object-fit: cover;
            border-radius: 10px;
            background-color: #e0e0e0;
        }
    </style>
</head>
<body>

    <div class="contenedor-app">
        <div class="header-menu">
            <h1>NUESTRO MENÚ</h1>
        </div>

        {% set categorias = productos | map(attribute='categoria') | unique %}

        {% for cat in categorias %}
            <h2 style="color: #d9534f; margin-top: 25px; border-bottom: 2px solid #eee; padding-bottom: 5px; text-transform: uppercase;">{{ cat }}</h2>
            
            {% for producto in productos if producto.categoria == cat %}
            <div class="card" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding: 10px; border-bottom: 1px solid #ddd;">
                <div class="info">
                    <div class="nombre" style="font-weight: bold;">{{ producto.nombre }}</div>
                    <div class="descripcion" style="font-size: 0.9em; color: #666;">{{ producto.descripcion }}</div>
                    <div class="precio" style="color: #0275d8; font-weight: bold;">MXN ${{ producto.precio }}</div>
                </div>
                <div class="controls" style="display: flex; align-items: center; gap: 8px;">
                    <button class="btn-qty" style="background: #d9534f; color: white; border: none; width: 30px; height: 30px; border-radius: 50%; font-size: 1.2em; cursor: pointer;" onclick="changeQty('{{ producto.nombre }}', {{ producto.precio }}, -1)">-</button>
                    <span class="qty" id="qty-{{ producto.nombre }}" style="font-weight: bold; font-size: 1.1em; width: 20px; text-align: center;">0</span>
                    <button class="btn-qty" style="background: #d9534f; color: white; border: none; width: 30px; height: 30px; border-radius: 50%; font-size: 1.2em; cursor: pointer;" onclick="changeQty('{{ producto.nombre }}', {{ producto.precio }}, 1)">+</button>
                </div>
            </div>
            {% endfor %}
        {% endfor %}
    </div>
